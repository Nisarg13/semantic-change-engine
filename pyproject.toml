[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "semantic-change-engine"
version = "2.0.0"
description = "Agentic semantic change detection as a REST API: spaCy clause segmentation, sentence embeddings, Hungarian alignment and a Claude evaluation agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "anthropic>=1.0",
    "spacy>=3.8,<3.9",
    # spaCy publishes its English pipeline as a wheel URL, not on PyPI.
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "sentence-transformers>=3.0",
    "scipy>=1.13",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_change"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "N"]
# Evidence strings use arrows (→) on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["semantic_change"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "scipy.*", "spacy", "spacy.*"]
ignore_missing_imports = true
