<text x="1103.0" y="151" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">5. Structured</text>
<text x="1103.0" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Output</text>
<text x="1103.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#0f172a" text-anchor="middle">JSON verdict</text>
<text x="1103.0" y="225" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">assignment format</text>
<text x="1103.0" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#0f172a" text-anchor="middle">Markdown report</text>
<text x="1103.0" y="279" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">what changed and</text>
