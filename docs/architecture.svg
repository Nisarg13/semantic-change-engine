<text x="294.0" y="151" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">1. Sentence</text>
<text x="294.0" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Tokenizer</text>
<text x="294.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#0f172a" text-anchor="middle">spaCy en_core_web_sm</text>
<text x="294.0" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">dependency parse</text>
<text x="294.0" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">splits each text into</text>
<text x="294.0" y="273" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">clause units</text>
<text x="294.0" y="301" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">a line break ends a unit,</text>
<text x="294.0" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">so bullets become units</text>
<rect x="410" y="130" width="170" height="220" rx="10" fill="#f5f3ff"/>
<path d="M410,178 V140 Q410,130 420,130 H570 Q580,130 580,140 V178 Z" fill="#7c3aed"/>
<rect x="410" y="130" width="170" height="220" rx="10" fill="none" stroke="#7c3aed" stroke-width="2"/>
<text x="495.0" y="151" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">2. Embedding</text>
<text x="495.0" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Layer</text>
<text x="495.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#0f172a" text-anchor="middle">all-MiniLM-L6-v2</text>
<text x="495.0" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">sentence-transformers</text>
<text x="495.0" y="254" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">one normalized vector</text>
<text x="495.0" y="273" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">for each unit</text>
<text x="495.0" y="301" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">cosine similarity =</text>
<text x="495.0" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">dot product</text>
<rect x="606" y="130" width="180" height="220" rx="10" fill="#ecfeff"/>
<path d="M606,178 V140 Q606,130 616,130 H776 Q786,130 786,140 V178 Z" fill="#0e7490"/>
<rect x="606" y="130" width="180" height="220" rx="10" fill="none" stroke="#0e7490" stroke-width="2"/>
<text x="696.0" y="151" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">3. Semantic Alignment</text>
<text x="696.0" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">&amp; Clustering</text>
<text x="696.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">1. same wording first</text>
<text x="696.0" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">2. Hungarian matching</text>
<text x="696.0" y="244" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">on cosine (SciPy)</text>
<text x="696.0" y="264" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">3. split / merge clustering</text>
<text x="696.0" y="296" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#0f172a" text-anchor="middle">status of each unit:</text>
<text x="696.0" y="314" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">unchanged, moved,</text>
<text x="696.0" y="331" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">modified, inserted, deleted</text>
<rect x="812" y="130" width="190" height="220" rx="10" fill="#fff7ed"/>
<path d="M812,178 V140 Q812,130 822,130 H992 Q1002,130 1002,140 V178 Z" fill="#c2410c"/>
<rect x="812" y="130" width="190" height="220" rx="10" fill="none" stroke="#c2410c" stroke-width="2"/>
<text x="907.0" y="151" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">4. LLM Evaluation</text>
<text x="907.0" y="168" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">Loop (agent)</text>
<text x="907.0" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" fill="#0f172a" text-anchor="middle">Claude agent</text>
<text x="907.0" y="225" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">Claude Sonnet or Opus</text>
<text x="907.0" y="252" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="bold" font-style="normal" fill="#0f172a" text-anchor="middle">tool loop:</text>
<text x="907.0" y="271" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">inspect_unit</text>
<text x="907.0" y="289" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">record_finding</text>
<text x="907.0" y="307" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">submit_verdict</text>
<text x="907.0" y="333" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#0f172a" text-anchor="middle">type, severity and risk</text>
