<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Architecture of the Semantic Change Detection Engine">
<rect width="1200" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
<text x="600.0" y="44" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" font-style="normal" fill="#0f172a" text-anchor="middle">Semantic Change Detection Engine</text>
<text x="600.0" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">Stages 1 to 3: deterministic NLP. Stage 4: a Claude agent with tools.</text>
