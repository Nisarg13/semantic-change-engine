<text x="99" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#0f172a" text-anchor="middle">Document A</text>
<text x="99" y="206" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">original text (text_a)</text>
<rect x="24" y="250" width="150" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="99" y="284" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#0f172a" text-anchor="middle">Document B</text>
<text x="99" y="306" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">modified text (text_b)</text>
